[project]
name = "acu"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Carlos Eduardo Ferreyra", email = "eduferreyraok@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
acu = "acu:main"

[tool.maturin]
module-name = "acu._core"
python-packages = ["acu"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
