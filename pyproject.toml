[project]
name = "acu"
version = "0.1.7"
description = "ACU infrastructure prototype retired; development continues in SCU"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Carlos Eduardo Ferreyra", email = "eduferreyraok@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
keywords = ["acu", "scu", "retired"]

[project.urls]
Homepage = "https://github.com/carlosferreyra/scu"
Documentation = "https://github.com/carlosferreyra/scu#readme"
Repository = "https://github.com/carlosferreyra/acu"
Changelog = "https://github.com/carlosferreyra/acu/releases"
Successor = "https://github.com/carlosferreyra/scu"

[project.scripts]
acu = "acu:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acu"]
